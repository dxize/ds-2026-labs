worker_processes 1;
events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    sendfile on;
    
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" upstream=$upstream_addr';
    access_log /logs/access.log main;
    
    upstream backend {
        # Теперь все запросы от одного IP будут идти на один и тот же сервер
        ip_hash; 
        # по очереди
        # least_conn; кто свободнее
        # ip_hash; по апи выбирает нужный сервер обычно тот же
        # хэш по параметру
        # веса
        
        server host.docker.internal:5001 max_fails=2 fail_timeout=5s;
        server host.docker.internal:5002 max_fails=2 fail_timeout=5s;
    }

    server {
        listen 8080;
        server_name localhost;
        
        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Указываем, что используем HTTP/1.1 (обязательно для сокетов)
            proxy_http_version 1.1;
            # Пробрасываем заголовки обновления соединения
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            proxy_next_upstream error timeout http_502 http_503 http_504;
            
            # чтобы видеть, какой backend ответил
            add_header X-Upstream $upstream_addr always;
        }
    }
}